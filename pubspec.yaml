name: gotrip
description: FYP Smart Landmark Recognition App
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10

  animated_splash_screen: ^1.3.0
  lottie: ^3.3.2

  random_string: ^2.3.1
  shared_preferences: ^2.0.18

  google_fonts: ^6.2.1  
  font_awesome_flutter: ^10.12.0
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_svg: ^2.2.3
  provider: ^6.0.5
  geolocator: ^9.0.2
  http: ^1.2.0
  image_picker: ^0.8.7+4
  fl_chart: ^0.70.0
  camera: ^0.11.0+1
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_commons: ^0.11.0

  google_maps_flutter: ^2.4.0 


dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/Mobile Apps.json
    - assets/Map Location Pointer.json

