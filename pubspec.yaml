name: gotrip
description: FYP Smart Landmark Recognition App
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.7.0
  google_sign_in: ^6.1.0
  flutter_tts: ^4.0.2

  animated_splash_screen: ^1.3.0
  lottie: ^3.3.2
  crypto: ^3.0.3

  random_string: ^2.3.1
  shared_preferences: ^2.0.18
  url_launcher: ^6.1.10
  google_fonts: ^6.2.1  
  font_awesome_flutter: ^10.12.0
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_svg: ^2.2.3
  provider: ^6.0.5
  geolocator: ^9.0.2
  geocoding: ^3.0.0
  http: ^1.2.0
  intl: ^0.19.0
  image_picker: ^0.8.7+4
  path_provider: ^2.1.1  
  image: ^4.1.7
  video_player: ^2.9.2
  fl_chart: ^0.70.0
  camera: ^0.11.0+1
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_commons: ^0.11.0
  google_maps_flutter: ^2.4.0 
  compassx: ^1.0.1
  connectivity_plus: ^6.0.0
  share_plus: ^10.0.0
  algolia_helper_flutter: ^1.0.0


dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1



flutter_native_splash:
  color: "#ffffff"
  
flutter_icons:
  android: true
  ios: true
  image_path: "assets/gotrip_logo_1024.png"
  remove_alpha_ios: true



flutter:
  uses-material-design: true

  assets:
    - assets/images/profile.jpg
    - assets/images/image1.jpg
    - assets/images/image2.jpg
    - assets/images/planess.jpg
    - assets/images/longbg.jpg
    - assets/images/longbg1.jpg
    - assets/Mobile Apps.json
    - assets/Map Location Pointer.json