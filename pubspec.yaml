name: gotrip
description: FYP Smart Landmark Recognition App
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1  
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  geolocator: ^9.0.2
  http: ^1.2.0
  image_picker: ^0.8.7+4
  lottie: ^3.1.2
  fl_chart: ^0.70.0
  camera: ^0.11.0+1
  google_mlkit_image_labeling: ^0.14.1
  google_maps_flutter: ^2.4.0 


dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/en.json
    - assets/lang/cn.json
